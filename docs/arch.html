<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saga architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <!-- forward steps -->
  <g font-size="12">
    <rect x="60" y="80" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="160" y="108" text-anchor="middle" font-weight="700" fill="#1d4ed8">create order</text>
    <text x="160" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">compensate: cancel order</text>

    <rect x="300" y="80" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="400" y="108" text-anchor="middle" font-weight="700" fill="#1d4ed8">charge balance</text>
    <text x="400" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">compensate: refund balance</text>

    <rect x="540" y="80" width="200" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="640" y="108" text-anchor="middle" font-weight="700" fill="#b91c1c">deduct stock</text>
    <text x="640" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">compensate: restore stock</text>
  </g>
  <line x1="260" y1="120" x2="300" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="120" x2="540" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- compensation reverse arrows -->
  <path d="M 640 160 Q 640 220 400 220 Q 160 220 160 160" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 3" marker-end="url(#arrR)"/>
  <text x="400" y="210" text-anchor="middle" font-size="11.5" fill="#b91c1c">on failure: reverse-compensate executed steps</text>

  <!-- result -->
  <rect x="200" y="280" width="600" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">end state</text>
  <text x="500" y="332" text-anchor="middle" font-size="11.5" fill="#334155">committed (all steps ok)  ·  compensated (failure undone reverse-order)</text>
  <text x="500" y="354" text-anchor="middle" font-size="11" fill="#64748b">no global lock, no 2PC — each step commits locally, failure is undone.</text>
</svg>
</body>
</html>
